<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compétences</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .card {
            cursor: pointer;
            transition: transform 0.5s ease, box-shadow 0.5s ease;
        }

        .card:hover {
            transform: scale(1.04);
            box-shadow: 0 0 20px 5px rgba(255, 255, 255, 0.5);
            text-shadow: 0 2px 5px rgba(128, 128, 128, 0.5);
        }

        .competence-icon {
            max-width: 50px;
            max-height: 50px;
            margin: 0 auto;
            filter: grayscale(100%) brightness(0);
        }
    </style>
</head>
<body class="bg-black text-white min-h-screen">
    <!-- Header avec boutons -->
    <header class="p-5 absolute w-full top-0 flex justify-center items-center z-10">
        <button class="but absolute top-5 left-5 bg-black text-white p-3 text-xl rounded tracking-widest border border-white z-20" onclick="history.back()">
            ← Back
        </button>
        <button class="but bg-black text-white p-3 text-xl rounded tracking-widest border border-white" onclick="window.location.href='/main/main.html'">
            Louis Copmartin
        </button>
    </header>

    <!-- Titre principal -->
    <div class="mt-40 flex justify-center">
        <h1 class="bg-white max-w-[400px] text-4xl font-serif font-bold tracking-wide border-4 border-gray-300 rounded-[16px] pb-2 min-h-[75px] min-w-[400px] text-black flex items-center justify-center">
            Mes Compétences
        </h1>
    </div>

    <!-- Contenu principal -->
    <main class="mt-12 px-6">
        <!-- Catégorie 1 -->
        <div class="mb-12">
            <h2 class="text-2xl font-serif font-bold mb-4 bg-gray-600 min-h-[65px] max-w-[240px] border-2 border-white flex items-center text-center rounded-[16px]">
                Langages de Programmation
            </h2>
            <div class="flex flex-wrap gap-4">
                <div class="card bg-white border border-gray-500 rounded-lg p-6 w-[300px] text-black flex flex-col items-center justify-center">
                    <img src="/img/logoSkills/java_logo.png" class="competence-icon">
                    <strong>Java</strong>
                </div>
                <div class="card bg-white border border-gray-500 rounded-lg p-6 w-[300px] text-black flex flex-col items-center justify-center">
                    <img src="/img/logoSkills/cSharp_logo.png" class="competence-icon">
                    <strong>C#</strong>
                </div>
                <div class="card bg-white border border-gray-500 rounded-lg p-6 w-[300px] text-black flex flex-col items-center justify-center">
                    <img src="/img/logoSkills/c_logo.png" class="competence-icon">
                    <strong>C</strong>
                </div>
                <div class="card bg-white border border-gray-500 rounded-lg p-6 w-[300px] text-black flex flex-col items-center justify-center">
                    <img src="/img/logoSkills/php_logo.png" class="competence-icon">
                    <strong>PHP</strong>
                </div>
                <div class="card bg-white border border-gray-500 rounded-lg p-6 w-[300px] text-black flex flex-col items-center justify-center">
                    <img src="/img/logoSkills/python_logo.png" class="competence-icon">
                    <strong>Python</strong>
                </div>
                <div class="card bg-white border border-gray-500 rounded-lg p-6 w-[300px] text-black flex flex-col items-center justify-center">
                    <img src="/img/logoSkills/mysql_logo.png" class="competence-icon">
                    <strong>MySql</strong>
                </div>
            </div>
        </div>

        <!-- Catégorie 2 -->
        <div class="mb-12">
            <h2 class="text-2xl font-serif font-bold mb-4 bg-gray-600 min-h-[65px] max-w-[240px] border-2 border-white flex items-center text-center rounded-[16px]">
                Technologies Web
            </h2>
            <div class="flex flex-wrap gap-4">
                <div class="card bg-white border border-gray-500 rounded-lg p-6 w-[300px] text-black flex flex-col items-center justify-center">
                    <img src="/img/logoSkills/html_logo.png" class="competence-icon">
                    <strong>HTML</strong>
                </div>
                <div class="card bg-white border border-gray-500 rounded-lg p-6 w-[300px] text-black flex flex-col items-center justify-center">
                    <img src="/img/logoSkills/css_logo.png" class="competence-icon">
                    <strong>CSS</strong>
                </div>
                <div class="card bg-white border border-gray-500 rounded-lg p-6 w-[300px] text-black flex flex-col items-center justify-center">
                    <img src="/img/logoSkills/js_logo.png" class="competence-icon">
                    <strong>JavaScript</strong>
                </div>
                <div class="card bg-white border border-gray-500 rounded-lg p-6 w-[300px] text-black flex flex-col items-center justify-center">
                    <img src="/img/logoSkills/symfony.png" class="competence-icon">
                    <strong>Symfony</strong>
                </div>
            </div>
        </div>

        <!-- Catégorie 3 -->
        <div class="mb-12">
            <h2 class="text-2xl font-serif font-bold mb-4 bg-gray-600 min-h-[65px] max-w-[240px] border-2 border-white flex items-center justify-center text-center rounded-[16px]">
               Other Skills
            </h2>
            <div class="flex flex-wrap gap-4">
                <div class="card bg-white border border-gray-500 rounded-lg p-6 w-[300px] text-black flex flex-col items-center justify-center">
                    <img src="/img/logoSkills/aws_logo.png" class="competence-icon">
                    <strong>Gitlab</strong>
                </div>
                <div class="card bg-white border border-gray-500 rounded-lg p-6 w-[300px] text-black flex flex-col items-center justify-center">
                    <img src="/img/logoSkills/azure_logo.png" class="competence-icon">
                    <strong>Docker</strong>
                </div>
                <div class="card bg-white border border-gray-500 rounded-lg p-6 w-[300px] text-black flex flex-col items-center justify-center">
                    <img src="/img/logoSkills/google_cloud_logo.png" class="competence-icon">
                    <strong>UML</strong>
                </div>
                <div class="card bg-white border border-gray-500 rounded-lg p-6 w-[300px] text-black flex flex-col items-center justify-center">
                    <img src="/img/logoSkills/docker_logo.png" class="competence-icon">
                    <strong>Bash</strong>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
